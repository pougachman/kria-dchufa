[project]
name = "kria-dchufa"
version = "0.1.0"
description = "Urgent Read: monthly literature curation and critical appraisal for Israeli emergency medicine residency programs"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
