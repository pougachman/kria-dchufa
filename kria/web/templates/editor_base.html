<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}מסך העורך · קריאה דחופה{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='editor.css') }}">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <header class="bg-white border-b-4 border-blue-700 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a href="/editor" class="flex items-baseline gap-3">
        <span class="font-bold text-lg">קריאה דחופה</span>
        <span class="text-slate-500 text-sm hidden sm:inline">מסך העורך הלאומי</span>
      </a>
      {% block header_actions %}{% endblock %}
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
