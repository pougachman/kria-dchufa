<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}מסך העורך · קריאה דחופה{% endblock %}</title>
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <header class="bg-white border-b-4 border-blue-700 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-baseline gap-4">
        <a href="/editor" class="font-bold text-lg">קריאה דחופה</a>
        <nav class="flex gap-3 text-sm">
          <a href="/editor" class="text-slate-600 hover:text-blue-700">דייג'סט חודשי</a>
          <a href="/editor/appraisals" class="text-slate-600 hover:text-blue-700">ניתוחים</a>
        </nav>
      </div>
      {% block header_actions %}{% endblock %}
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
