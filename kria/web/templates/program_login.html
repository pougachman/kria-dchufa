{% extends "program_base.html" %}
{% block title %}כניסה · קריאה דחופה{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow-sm p-6 mt-10">
  <h1 class="text-xl font-bold mb-1">כניסה למנהלי תוכניות</h1>
  <p class="text-sm text-slate-500 mb-4">את שם המשתמש והסיסמה הראשונה מקבלים מהעורך הלאומי.</p>
  {% if error %}<p class="text-red-700 mb-3">שם המשתמש או הסיסמה שגויים.</p>{% endif %}
  <form method="post" action="/program/login" class="space-y-4">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block"><span class="text-sm text-slate-600">שם משתמש</span>
      <input name="username" required autofocus autocomplete="username" autocapitalize="none"
             class="en mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-600 focus:outline-none"></label>
    <label class="block"><span class="text-sm text-slate-600">סיסמה</span>
      <input type="password" name="password" required autocomplete="current-password"
             class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-emerald-600 focus:outline-none"></label>
    <button class="w-full rounded-lg bg-emerald-600 text-white py-2 font-semibold hover:bg-emerald-700">כניסה</button>
  </form>
</div>
{% endblock %}
