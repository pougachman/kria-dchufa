{% extends "editor_base.html" %}
{% block title %}כניסה · קריאה דחופה{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow-sm p-6 mt-10">
  <h1 class="text-xl font-bold mb-4">כניסת עורך</h1>
  {% if not configured %}
    <p class="text-red-700">לא הוגדרה סיסמת עורך. יש להוסיף ב-Railway משתנה בשם <span class="en font-mono">EDITOR_PASSWORD</span>.</p>
  {% else %}
    {% if error %}<p class="text-red-700 mb-3">הסיסמה שגויה.</p>{% endif %}
    <form method="post" action="/editor/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block">
        <span class="text-sm text-slate-600">סיסמה</span>
        <input type="password" name="password" required autofocus autocomplete="current-password"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none">
      </label>
      <button class="w-full rounded-lg bg-blue-700 text-white py-2 font-semibold hover:bg-blue-800">כניסה</button>
    </form>
  {% endif %}
</div>
{% endblock %}
