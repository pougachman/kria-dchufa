# Claude API prices in USD per million tokens, used to log the cost of every model run.
# Source: Anthropic pricing as of November 2026. Check https://www.anthropic.com/pricing
# before relying on these numbers for a budget, and update this file when prices change.
# Haiku 5.5: these are the rates for prompts up to 100K tokens (screening prompts are ~2K).
version: 1
batch_discount: 0.5          # Message Batches cost 50% of the standard price
cache_write_multiplier: 1.25 # 5-minute cache writes
cache_read_multiplier: 0.1
models:
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
  # Possible server-side fallbacks for Opus 5.5 when it declines a request.
  claude-opus-5: {input: 5.00, output: 25.00}
  claude-opus-4-8: {input: 5.00, output: 25.00}
